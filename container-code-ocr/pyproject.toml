[project]
name = "container-code-ocr"
version = "0.1.0"
description = "OpenCV pipeline for detecting and recognizing shipping container codes."
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "opencv-python>=4.9",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "tqdm>=4.66",
]

[project.scripts]
container-ocr = "container_ocr.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
